[tox]
envlist =
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj60
    py{312,313,314}-dj61
    py{312,313,314}-djmain
    qa

[testenv]
extras = tests, daphne
commands =
    pytest -v {posargs}
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz

[testenv:parallel]
# Django pinned explicitly: the env name carries no dj factor.
# Run with -m so script-mode manage.py cannot shadow the repo-root tests.
# Every live-server module below is parallel-safe: each "second server" class
# establishes its own baseline instead of relying on another class having run
# first in the same process, so the runner may split classes across workers.
# tblib is installed so a red parallel run shows the real traceback rather than
# Django's "install tblib" hint.
extras = tests, daphne
deps =
    Django>=5.2,<6.0
    tblib
setenv =
    PYTHONPATH = {tox_root}{:}{tox_root}/tests/sample_project
commands =
    python -m tests.sample_project.manage test \
        tests.sample_project.tests.test_live_server \
        tests.sample_project.tests.test_live_server_abandoned_request \
        tests.sample_project.tests.test_live_server_cached_chain \
        tests.sample_project.tests.test_live_server_graceful_shutdown \
        tests.sample_project.tests.test_live_server_mail_outbox \
        tests.sample_project.tests.test_live_server_stubborn_request \
        tests.sample_project.tests.test_live_server_thread_reuse \
        tests.sample_project.tests.test_live_server_websocket_subscriber \
        --parallel 2

[testenv:qa]
skip_install=true
deps =
    black
    flake8
    isort
commands =
    flake8 channels tests
    black --check channels tests
    isort --check-only --diff channels tests
